apiVersion: apps/v1
kind: Deployment
metadata:
  name: m-devops-dashboard
  namespace: m-devops-dashboard
  labels:
    app.kubernetes.io/name: m-devops-dashboard
    app.kubernetes.io/instance: m-devops-dashboard
    app.kubernetes.io/part-of: m-devops-transformation
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: m-devops-dashboard
      app.kubernetes.io/instance: m-devops-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: m-devops-dashboard
        app.kubernetes.io/instance: m-devops-dashboard
        app.kubernetes.io/part-of: m-devops-transformation
    spec:
      serviceAccountName: m-devops-dashboard
      terminationGracePeriodSeconds: 30
      containers:
        - name: dashboard
          image: ghcr.io/hepi66/m_devops_transformation:4f49e6c2e08adb78a659cae4279c23c9f30b8488
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: DASHBOARD_HISTORY_DB_PATH
              value: /data/dashboard_history.db
            - name: GITHUB_REPOSITORY
              value: hepi66/M_DevOps_Transformation
            - name: GITHUB_BRANCH
              value: main
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: m-devops-dashboard-github
                  key: token
                  optional: true
          volumeMounts:
            - name: dashboard-history
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dashboard-history
          persistentVolumeClaim:
            claimName: m-devops-dashboard-history
