apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m-devops-dashboard-history
  namespace: m-devops-dashboard
  labels:
    app.kubernetes.io/name: m-devops-dashboard
    app.kubernetes.io/instance: m-devops-dashboard
    app.kubernetes.io/part-of: m-devops-transformation
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
